name: External dataset screening
# Compact integrity metadata is refreshed by the repository repair workflow.

on:
  workflow_dispatch:
    inputs:
      deep_probe:
        description: Read a short waveform sample from open waveform datasets
        required: true
        type: boolean
        default: true
  push:
    branches:
      - feat/external-dataset-screening
    paths:
      - ".github/workflows/external-dataset-screening.yml"
      - "config/external_datasets.yaml"
      - "scripts/screen_external_datasets.py"
  pull_request:
    paths:
      - ".github/workflows/external-dataset-screening.yml"
      - "config/external_datasets.yaml"
      - "scripts/screen_external_datasets.py"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Verify current model inputs
        run: python -m src.cli verify

      - name: Screen candidate external datasets
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DEEP_PROBE: ${{ inputs.deep_probe }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ] || [ "$MANUAL_DEEP_PROBE" = "true" ]; then
            extra="--deep-probe"
          fi
          python scripts/screen_external_datasets.py \
            --config config/external_datasets.yaml \
            --output-dir artifacts/external-dataset-screening \
            $extra

      - name: Publish screening summary
        run: cat artifacts/external-dataset-screening/external_dataset_screening.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: external-dataset-screening
          path: artifacts/external-dataset-screening
          if-no-files-found: error
