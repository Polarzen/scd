name: Model validation

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: Endpoint horizon in days
        required: true
        type: choice
        default: "365"
        options:
          - "90"
          - "180"
          - "365"
          - "730"
      profile:
        description: Frozen feature profile
        required: true
        type: choice
        default: all20
        options:
          - all20
          - physiology_only
      model:
        description: Model to validate
        required: true
        type: choice
        default: extratrees
        options:
          - extratrees
          - logistic
          - dummy
      seed:
        description: Deterministic random seed
        required: true
        type: string
        default: "42"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Verify compact inputs
        run: |
          python scripts/verify_all.py
          python -m src.cli verify

      - name: Run selected nested validation
        run: |
          python -m src.cli validate \
            --endpoint "${{ inputs.endpoint }}" \
            --profile "${{ inputs.profile }}" \
            --model "${{ inputs.model }}" \
            --seed "${{ inputs.seed }}" \
            --n-jobs 1 \
            --output-dir artifacts/model-validation/run

      - name: Arrange machine-readable outputs
        run: |
          set -euo pipefail
          output="artifacts/model-validation/run"
          mkdir -p artifacts/model-validation/{oof,metrics,folds,bootstrap,population,config}
          cp "$output"/*oof* artifacts/model-validation/oof/
          cp "$output"/*folds* artifacts/model-validation/folds/
          cp "$output"/*summary.json artifacts/model-validation/metrics/
          cp config/*.yaml artifacts/model-validation/config/
          cp "$output"/*analysis_population.csv artifacts/model-validation/population/
          python -c "import json; from pathlib import Path; p=next(Path('$output').glob('*summary.json')); s=json.loads(p.read_text(encoding='utf-8')); Path('artifacts/model-validation/bootstrap/bootstrap.json').write_text(json.dumps(s.get('bootstrap', {}), indent=2, ensure_ascii=False)+'\\n', encoding='utf-8'); Path('artifacts/model-validation/population/population.json').write_text(json.dumps({k:s.get(k) for k in ('patient_count','positive_count','negative_count')}, indent=2)+'\\n', encoding='utf-8')"

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-${{ inputs.model }}-${{ inputs.profile }}-${{ inputs.endpoint }}d-seed${{ inputs.seed }}
          path: artifacts/model-validation
          if-no-files-found: error
