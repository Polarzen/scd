name: P3 complete validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p3-validation
    paths:
      - ".github/workflows/p3-validation.yml"
      - "scripts/validate_p3.py"

permissions:
  contents: read

jobs:
  repeated:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - batch: "00-09"
            seed_start: 0
            seed_stop: 9
          - batch: "10-19"
            seed_start: 10
            seed_stop: 19
          - batch: "20-29"
            seed_start: 20
            seed_stop: 29
          - batch: "30-39"
            seed_start: 30
            seed_stop: 39
          - batch: "40-49"
            seed_start: 40
            seed_stop: 49
          - batch: "50-59"
            seed_start: 50
            seed_stop: 59
          - batch: "60-69"
            seed_start: 60
            seed_stop: 69
          - batch: "70-79"
            seed_start: 70
            seed_stop: 79
          - batch: "80-89"
            seed_start: 80
            seed_stop: 89
          - batch: "90-99"
            seed_start: 90
            seed_stop: 99

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Verify committed model inputs
        run: python -m src.cli verify

      - name: Validate P2 and P3 seeds
        env:
          SEED_START: ${{ matrix.seed_start }}
          SEED_STOP: ${{ matrix.seed_stop }}
          BATCH: ${{ matrix.batch }}
        run: |
          python scripts/validate_p3.py batch \
            --seed-start "$SEED_START" \
            --seed-stop "$SEED_STOP" \
            --output-dir "artifacts/p3/batch-$BATCH"

      - name: Upload batch output
        uses: actions/upload-artifact@v4
        with:
          name: p3-batch-${{ matrix.batch }}
          path: artifacts/p3/batch-${{ matrix.batch }}
          if-no-files-found: error

  aggregate:
    needs: repeated
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Download all P3 batches
        uses: actions/download-artifact@v4
        with:
          pattern: p3-batch-*
          path: artifacts/p3/runs

      - name: Aggregate repeated validation and bootstrap
        run: |
          python scripts/validate_p3.py aggregate \
            --input-root artifacts/p3/runs \
            --output-dir artifacts/p3/final \
            --bootstrap-resamples 2000 \
            --bootstrap-seed 20260927

      - name: Publish result
        run: cat artifacts/p3/final/p3_validation_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final P3 result
        uses: actions/upload-artifact@v4
        with:
          name: p3-complete-validation
          path: artifacts/p3/final
          if-no-files-found: error
