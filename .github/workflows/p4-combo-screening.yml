name: P4 ProBNP combo screening

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p4-optimization
    paths:
      - ".github/workflows/p4-combo-screening.yml"
      - "scripts/validate_p4_combo.py"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        second:
          - PRIOR_MI
          - SYNCOPE
          - NSVT_GT10
          - SEX_MALE
          - VT_ANY
          - QRS
          - QTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - name: Validate ProBNP combo
        run: |
          python scripts/validate_p4_combo.py \
            --second "${{ matrix.second }}" \
            --seed-start 0 \
            --seed-stop 19 \
            --output-dir "artifacts/combo/${{ matrix.second }}"
      - uses: actions/upload-artifact@v4
        with:
          name: p4-combo-${{ matrix.second }}
          path: artifacts/combo/${{ matrix.second }}
          if-no-files-found: error
