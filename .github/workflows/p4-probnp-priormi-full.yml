name: P4 ProBNP PriorMI full validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p4-optimization
    paths:
      - ".github/workflows/p4-probnp-priormi-full.yml"

permissions:
  contents: read

jobs:
  repeated:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - batch: "00-09"
            start: 0
            stop: 9
          - batch: "10-19"
            start: 10
            stop: 19
          - batch: "20-29"
            start: 20
            stop: 29
          - batch: "30-39"
            start: 30
            stop: 39
          - batch: "40-49"
            start: 40
            stop: 49
          - batch: "50-59"
            start: 50
            stop: 59
          - batch: "60-69"
            start: 60
            stop: 69
          - batch: "70-79"
            start: 70
            stop: 79
          - batch: "80-89"
            start: 80
            stop: 89
          - batch: "90-99"
            start: 90
            stop: 99
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - name: Validate final candidate batch
        run: |
          python scripts/validate_p4_combo.py \
            --second PRIOR_MI \
            --seed-start "${{ matrix.start }}" \
            --seed-stop "${{ matrix.stop }}" \
            --output-dir "artifacts/final/${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: p4-priormi-final-${{ matrix.batch }}
          path: artifacts/final/${{ matrix.batch }}
          if-no-files-found: error
