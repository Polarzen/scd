name: P4 candidate screening

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p4-optimization
    paths:
      - ".github/workflows/p4-screening.yml"
      - "scripts/validate_p4.py"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        candidate:
          - BASE
          - QRS
          - QTC
          - PRIOR_MI
          - SYNCOPE
          - VT_ANY
          - NSVT_GT10
          - SEX_MALE
          - LOG_PROBNP
          - CREATININE
          - SODIUM

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - name: Verify committed model inputs
        run: python -m src.cli verify
      - name: Screen candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python scripts/validate_p4.py \
            --candidate "$CANDIDATE" \
            --seed-start 0 \
            --seed-stop 19 \
            --output-dir "artifacts/p4/$CANDIDATE"
      - uses: actions/upload-artifact@v4
        with:
          name: p4-screen-${{ matrix.candidate }}
          path: artifacts/p4/${{ matrix.candidate }}
          if-no-files-found: error
