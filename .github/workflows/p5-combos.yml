name: P5 compact combinations

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p3-validation
    paths:
      - ".github/workflows/p5-combos.yml"
      - "scripts/validate_p5_combos.py"
      - "scripts/validate_p4_single_additions.py"
      - "scripts/validate_compact_candidates.py"
      - "scripts/validate_p3.py"

permissions:
  contents: read

jobs:
  combo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        combo:
          - pro_bnp_nsvt
          - pro_bnp_qrs
          - pro_bnp_qtc
          - pro_bnp_vt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - run: python -m src.cli verify
      - name: Validate combo
        env:
          COMBO: ${{ matrix.combo }}
        run: |
          python scripts/validate_p5_combos.py run \
            --combo "$COMBO" \
            --seed-start 0 \
            --seed-stop 99 \
            --output-dir "artifacts/p5/$COMBO"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-${{ matrix.combo }}
          path: artifacts/p5/${{ matrix.combo }}
          if-no-files-found: error

  aggregate:
    needs: combo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --requirement requirements-lock.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-*
          path: artifacts/p5/runs
      - run: |
          python scripts/validate_p5_combos.py summarize \
            --input-root artifacts/p5/runs \
            --output-dir artifacts/p5/final
      - run: cat artifacts/p5/final/combo_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p5-combos-complete
          path: artifacts/p5/final
          if-no-files-found: error
