name: Repair compact integrity

on:
  push:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Re-finalize compact package on GitHub runner
        run: python scripts/finalize_phase4.py

      - name: Verify repaired integrity
        run: |
          python scripts/verify_all.py
          python -m pytest -q

      - name: Commit repaired integrity metadata
        run: |
          if git diff --quiet; then
            echo "No integrity repair changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/integrity/build_manifest.json data/integrity/compact_sha256.txt reports/PHASE4_SIZE_REPORT.json reports/PHASE4_SIZE_REPORT.md reports/github_handoff.json
          git commit -m "repair compact integrity metadata"
          git push
