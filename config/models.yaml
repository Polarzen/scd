schema_version: 1
purpose: P4-C patient-level model validation
models:
  extratrees:
    kind: extratrees
    primary: true
    preprocessing:
      imputation: median
      scaling: none
    search:
      type: randomized
      scoring: average_precision
      n_iter: 24
      params:
        clf__n_estimators: [400, 800, 1200, 1600]
        clf__max_depth: [null, 4, 6, 8, 10, 14]
        clf__min_samples_split: [2, 4, 6, 8, 10]
        clf__min_samples_leaf: [1, 2, 3, 4]
        clf__max_features: [sqrt, log2, 0.5, 0.7]
        clf__class_weight: [balanced, {0: 1, 1: 2}, {0: 1, 1: 3}]
  logistic:
    kind: logistic
    primary: false
    preprocessing:
      imputation: median
      scaling: standard
    estimator:
      penalty: l2
      solver: liblinear
      max_iter: 2000
    search:
      type: grid
      scoring: average_precision
      params:
        clf__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  dummy:
    kind: dummy
    primary: false
    preprocessing:
      imputation: median
      scaling: none
    estimator:
      strategy: prior
    search:
      type: none
threshold:
  method: target-specificity
  target_specificity: 0.70
